<!-- Reference markup for Button. Adapters (Twig, PHP, React) must output exactly this. -->

<!-- Primary (default) -->
<button class="uoa-button" type="button">Υποβολή αίτησης</button>

<!-- Secondary / tertiary -->
<button class="uoa-button uoa-button--secondary" type="button">Αποθήκευση</button>
<button class="uoa-button uoa-button--tertiary" type="button">Ακύρωση</button>

<!-- Small -->
<button class="uoa-button uoa-button--sm" type="button">Φίλτρα</button>

<!-- Link that looks like a button: use only when it navigates -->
<a class="uoa-button" href="/admissions">Εισαγωγή στο Τμήμα</a>

<!-- With icon (decorative icon: aria-hidden) -->
<button class="uoa-button" type="button">
  <svg class="uoa-button__icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
  Λήψη προγράμματος
</button>

<!-- Icon-only: needs an accessible name -->
<button class="uoa-button uoa-button--secondary" type="button" aria-label="Αναζήτηση">
  <svg class="uoa-button__icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
</button>

<!-- Disabled -->
<button class="uoa-button" type="button" disabled>Υποβολή αίτησης</button>
<a class="uoa-button" aria-disabled="true">Εισαγωγή στο Τμήμα</a>

<!-- Full width -->
<button class="uoa-button uoa-button--block" type="submit">Σύνδεση</button>

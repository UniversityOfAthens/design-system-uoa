<!-- Reference markup for Breadcrumb. Adapters (Twig, PHP, React) must output exactly this.
     Native <nav> + <ol>: the list order carries the hierarchy, so no ARIA roles
     are added. The accessible name lives on the <nav> so platforms translate it.
     The separator is decorative (aria-hidden); the last crumb is the current page
     and is never a link. -->

<!-- Standard trail: root → section → subsection → current page -->
<nav class="uoa-breadcrumb" aria-label="Διαδρομή πλοήγησης">
  <ol class="uoa-breadcrumb__list">
    <li class="uoa-breadcrumb__item">
      <a class="uoa-breadcrumb__link" href="/">Αρχική</a>
      <svg class="uoa-breadcrumb__separator" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M12.6 12L8 7.4L9.4 6l6 6l-6 6L8 16.6z"/></svg>
    </li>
    <li class="uoa-breadcrumb__item">
      <a class="uoa-breadcrumb__link" href="/studies">Σπουδές</a>
      <svg class="uoa-breadcrumb__separator" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M12.6 12L8 7.4L9.4 6l6 6l-6 6L8 16.6z"/></svg>
    </li>
    <li class="uoa-breadcrumb__item">
      <a class="uoa-breadcrumb__link" href="/studies/undergraduate">Προπτυχιακές σπουδές</a>
      <svg class="uoa-breadcrumb__separator" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M12.6 12L8 7.4L9.4 6l6 6l-6 6L8 16.6z"/></svg>
    </li>
    <li class="uoa-breadcrumb__item">
      <span class="uoa-breadcrumb__current" aria-current="page">Τμήμα Φιλολογίας</span>
    </li>
  </ol>
</nav>

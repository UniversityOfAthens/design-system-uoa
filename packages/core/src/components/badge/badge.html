<!-- Reference markup for Badge. Adapters (Twig, PHP, React) must output exactly this.
     The words carry the meaning, never the colour alone. -->

<!-- Neutral (default) -->
<span class="uoa-badge">Νέο πρόγραμμα</span>

<!-- Variants -->
<span class="uoa-badge uoa-badge--info">Προθεσμία: 12 Οκτ</span>
<span class="uoa-badge uoa-badge--success">Εγκρίθηκε</span>
<span class="uoa-badge uoa-badge--warning">Θέσεις περιορισμένες</span>
<span class="uoa-badge uoa-badge--danger">Ακυρώθηκε</span>

<!-- Next to a heading: the badge names the status, the heading names the thing -->
<h2>Μεταπτυχιακό «Ψηφιακές Ανθρωπιστικές Επιστήμες» <span class="uoa-badge uoa-badge--success">Εγγραφές ανοιχτές</span></h2>

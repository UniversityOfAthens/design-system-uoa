name: WordPress

# The UOA theme and the UOA Blocks plugin (packages/wordpress), apart from the docs-site
# CI: they need PHP and a WordPress, not the docs' Playwright image. Mirrors the Serif
# theme/plugin pipeline: coding standards → PHPUnit on every supported PHP → e2e + axe
# on wp-env → the installable zips.
on:
  pull_request:
    paths: &paths
      - 'packages/wordpress/**'
      - 'packages/core/**'
      - 'packages/icons/**'
      - 'packages/tokens/**'
      - 'bun.lock'
      - '.github/workflows/wordpress.yml'
  push:
    branches: [develop]
    paths: *paths

concurrency:
  group: wordpress-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/wordpress

jobs:
  lint:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs --standard=phpcs.xml

  unit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      # The contract test reads the icon set from @uoa/icons/dist.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
        working-directory: packages/icons
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  e2e:
    name: Playwright + axe (wp-env), bundle
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: .
      # tokens → icons → core → copied into the theme and the plugin.
      - run: bun run build
        working-directory: .
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - name: Start WordPress (wp-env), activate theme + plugin, seed content
        run: bun run start
      - run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/wordpress/tests/e2e-pw/playwright-report
          retention-days: 7
      - name: Show WordPress debug.log
        if: failure()
        run: bunx wp-env run cli sh -c 'cat wp-content/debug.log 2>/dev/null || echo "no debug.log"'

      - run: bun run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-zips
          path: packages/wordpress/dist/*.zip
